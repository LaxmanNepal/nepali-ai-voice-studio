services:
  voice-studio:
    build:
      context: .
      args:
        BACKEND_REQ: backends/pocket_tts/requirements.txt
    ports:
      - "7860:7860"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      LOG_LEVEL: INFO
      VOICE_OUTPUT_DIR: /app/outputs
    volumes:
      - hf-cache:/root/.cache/huggingface
      - voice-outputs:/app/outputs
    restart: unless-stopped

volumes:
  hf-cache:
  voice-outputs:
